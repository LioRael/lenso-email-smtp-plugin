[workspace]
resolver = "2"
members = ["crates/lenso-email-smtp-plugin"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LioRael/lenso-email-smtp-plugin"
rust-version = "1.94"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
lenso = "0.5.0"
lenso-capability-email-dispatch = "0.1.1"
lenso-capability-secrets = "0.1.1"
lenso-kernel = "0.2.0"
lenso-postgres-kit = "0.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "chrono", "json"] }
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt", "time"] }
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
result_large_err = "allow"
too_many_lines = "allow"
